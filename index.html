<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تعلم ونطق الكلمات الاحترافية | Ultimate Vocabulary Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4338ca;
            --primary-light: #eef2ff;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border: #334155;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text-main); padding: 20px; min-height: 100vh; }

        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 32px; font-weight: 800; color: #818cf8; }
        .header p { color: var(--text-muted); font-size: 15px; }

        .container { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 1300px; margin: 0 auto; }
        @media (min-width: 950px) { .container { grid-template-columns: 340px 1fr; } }

        /* Panel */
        .panel { background: var(--card-bg); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); height: fit-content; }
        .upload-box { border: 2px dashed #475569; border-radius: 12px; padding: 25px; text-align: center; cursor: pointer; transition: 0.2s; background: #0f172a; }
        .upload-box:hover { border-color: #818cf8; background: #1e1b4b; }
        .upload-box input { display: none; }

        .group { margin-top: 16px; }
        .group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 700; }
        select, input[type="range"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: #fff; outline: none; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-p { background: var(--primary); color: #fff; }
        .btn-p:hover { background: #3730a3; }
        .btn-s { background: transparent; border: 1px solid var(--border); color: #fff; }
        .btn-s:hover { background: #334155; }

        /* Main Workspace */
        .workspace { background: var(--card-bg); border-radius: var(--radius); padding: 20px; border: 1px solid var(--border); }
        .status { padding: 12px; border-radius: 8px; background: #1e1b4b; color: #a5b4fc; font-weight: 700; margin-bottom: 16px; display: none; }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; direction: ltr; }

        /* Advanced Word Card */
        .card { background: #0f172a; border: 1px solid var(--border); border-radius: 12px; padding: 16px; position: relative; transition: 0.2s; }
        .card:hover { border-color: #818cf8; transform: translateY(-2px); }
        
        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 18px; font-weight: 700; color: #fff; }
        
        .actions { display: flex; gap: 6px; }
        .icon-btn { background: #1e293b; border: 1px solid var(--border); color: #a5b4fc; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; }
        .icon-btn:hover { background: var(--primary); color: #fff; }
        .delete-btn:hover { background: var(--accent-red); color: #fff; }

        .card-trans { font-size: 15px; color: var(--accent-green); direction: rtl; margin-top: 8px; font-weight: 600; min-height: 22px; }
        
        /* Image Preview Box */
        .img-container { margin-bottom: 16px; border-radius: 8px; overflow: hidden; max-height: 200px; display: none; text-align: center; background: #000; }
        .img-container img { max-height: 200px; width: auto; object-fit: contain; }
    </style>
</head>
<body>

<div class="header">
    <h1>🚀 منصة نطق وترجمة المفردات المتقدمة</h1>
    <p>استخراج ذكي للعبارات والكلمات، تنقية الشوائب، ونطق مخصص بصوت نقي</p>
</div>

<div class="container">
    <div class="panel">
        <div class="upload-box" onclick="document.getElementById('imgInp').click()">
            <div style="font-size: 30px;">📷</div>
            <strong>رفع صورة المفردات</strong>
            <input type="file" id="imgInp" accept="image/*" onchange="startProcess(event)">
        </div>

        <div class="group">
            <label>اللكنة الصوتية:</label>
            <select id="voiceAcc">
                <option value="en-US">الأمريكية (US)</option>
                <option value="en-GB">البريطانية (UK)</option>
            </select>
        </div>

        <div class="group">
            <label>سرعة النطق:</label>
            <input type="range" id="voiceSpd" min="0.3" max="1.1" step="0.1" value="0.8">
        </div>

        <button class="btn btn-p" onclick="playAll()">🔊 قراءة الكل بالتتابع</button>
        <button class="btn btn-s" onclick="exportCSV()">📊 تصدير إلى Excel (CSV)</button>
    </div>

    <div class="workspace">
        <div id="imgBox" class="img-container">
            <img id="imgPre" src="" alt="المعاينة">
        </div>

        <div id="status" class="status"></div>
        <div id="grid" class="cards-grid"></div>
    </div>
</div>

<script>
    let listData = [];

    // استخراج الذكي للكلمات والعبارات المزدوجة والتخلص من الرموز والكلمات غير المفيدة
    function extractPhrasesAndWords(text) {
        const lines = text.split('\n');
        let extracted = [];
        
        lines.forEach(line => {
            let cleanedLine = line.replace(/[^a-zA-Z\s-]/g, '').trim();
            if (cleanedLine.length > 2) {
                // الكلمات أو العبارات الفعالة
                if (cleanedLine.split(/\s+/).length <= 3) {
                    extracted.push(cleanedLine);
                } else {
                    cleanedLine.split(/\s+/).forEach(w => {
                        if (w.length > 3) extracted.push(w);
                    });
                }
            }
        });

        return [...new Set(extracted)];
    }

    async function fetchTranslation(text) {
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ar`);
            const data = await res.json();
            return data.responseData.translatedText || "---";
        } catch {
            return "تعذر الترجمة";
        }
    }

    async function startProcess(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('imgPre').src = URL.createObjectURL(file);
        document.getElementById('imgBox').style.display = 'block';

        const status = document.getElementById('status');
        const grid = document.getElementById('grid');
        
        status.style.display = 'block';
        status.innerText = "⏳ جاري قراءة الكلمات والعبارات وتنبيتها عالي الدقة...";
        grid.innerHTML = "";
        listData = [];

        try {
            const { data: { text } } = await Tesseract.recognize(file, 'eng');
            const items = extractPhrasesAndWords(text);

            if (items.length === 0) {
                status.innerText = "❌ لم يتم التعرف على كلمات واضحة. حاول مجدداً بصورة أوضح.";
                return;
            }

            status.innerText = `✅ تم استخراج (${items.length}) كلمة وعبارة بنجاح:`;

            items.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${idx}`;
                
                card.innerHTML = `
                    <div class="card-top">
                        <span class="card-title">${item}</span>
                        <div class="actions">
                            <button class="icon-btn" title="بطيء" onclick="speak('${item}', 0.4)">🐢</button>
                            <button class="icon-btn" title="نطق عادي" onclick="speak('${item}', null)">🔊</button>
                            <button class="icon-btn delete-btn" title="حذف" onclick="deleteCard(${idx})">✕</button>
                        </div>
                    </div>
                    <div class="card-trans" id="trans-${idx}">⏳ جاري الترجمة...</div>
                `;

                grid.appendChild(card);

                fetchTranslation(item).then(tr => {
                    document.getElementById(`trans-${idx}`).innerText = tr;
                    listData.push({ id: idx, word: item, translation: tr });
                });
            });

        } catch (err) {
            status.innerText = "❌ حدث خطأ في النظام أثناء معالجة الصورة.";
        }
    }

    function speak(text, customRate) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = document.getElementById('voiceAcc').value;
        utterance.rate = customRate || parseFloat(document.getElementById('voiceSpd').value);
        window.speechSynthesis.speak(utterance);
    }

    function deleteCard(idx) {
        const el = document.getElementById(`card-${idx}`);
        if (el) el.remove();
        listData = listData.filter(item => item.id !== idx);
    }

    function playAll() {
        if (listData.length === 0) return;
        let i = 0;
        function loop() {
            if (i >= listData.length) return;
            speak(listData[i].word);
            i++;
            setTimeout(loop, 2200);
        }
        loop();
    }

    function exportCSV() {
        if (listData.length === 0) return alert("القائمة فارغة!");
        let csv = "\uFEFFWord,Translation\n";
        listData.forEach(d => csv += `"${d.word}","${d.translation}"\n`);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'vocabulary.csv';
        a.click();
    }
</script>

</body>
</html>
